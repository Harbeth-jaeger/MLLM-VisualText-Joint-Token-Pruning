[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mllm-prune"
version = "0.1.0"
description = "Training-free visual-text token pruning experiments for MLLMs"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=12.0,<13",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "qwen-vl-utils>=0.0.14,<0.1",
  "torch>=2.6,<3",
  "transformers>=4.51,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

