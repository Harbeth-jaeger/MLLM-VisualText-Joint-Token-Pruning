experiment: "003_aligned_encoder_scoring"
retentions: [0.75, 0.50, 0.25]
methods:
  - fixed_joint
  - random_joint
  - raw_qwen_joint
  - aligned_uncalibrated
  - aligned_calibrated
random_seeds: [0, 1, 2]
max_new_tokens: 32
max_pixels: 401408
text_chunk:
  min_tokens: 16
  max_tokens: 64
vision_window: 2
token_top_fraction: 0.20
chunk_top_fraction: 0.20
modality_temperature: 0.10
chunk_temperature: 0.10
min_text_fraction: 0.05
min_vision_fraction: 0.10
fixed_text_fraction: 0.50
aligned_encoder:
  revision: "main"
  dtype: "bfloat16"
  text_batch_size: 64
  image_batch_size: 8
  image_resize: "square_full_image"
text_scoring:
  window_tokens: 16
  stride_tokens: 8
  overlap_reduce: "mean"
calibration:
  sample_weighting: "equal_sample_within_modality"
  tie_method: "midrank"
  interpolation: "step"
